<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CFG — Capabilities Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f9f7f4;
      color: #2c2c2c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e2dc;
      border-radius: 10px;
      padding: 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #999; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: normal; margin-bottom: 12px; }
    p { font-size: 14px; color: #777; line-height: 1.6; margin-bottom: 32px; }
    .badge {
      display: inline-block;
      background: #fff3e0;
      color: #e65c00;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }
    a { font-size: 13px; color: #3a6b35; text-decoration: none; border-bottom: 1px solid #3a6b35; padding-bottom: 2px; }
    a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Collaboration for Good &middot; Site Mockup</p>
    <h1>Capabilities</h1>
    <p>Collaborate / Create / Report / Lead framework</p>
    <div class="badge">In Progress</div>
    <br/><br/>
    <a href="../../..">&#8592; Back to all mockups</a>
  </div>
</body>
</html>
